<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beispiele</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      :root {
        --bg: #e8ebee;
        --ink: #172033;
        --muted: #5a6478;
        --line: #c5cbd3;
        --accent: #2b45f0;
        --row-hover: #dde2e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12161f;
          --ink: #e4e8ef;
          --muted: #8b95a8;
          --line: #2a3140;
          --accent: #8c9cff;
          --row-hover: #1a202c;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Bricolage Grotesque",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 1.0625rem;
        line-height: 1.5;
        padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(3rem, env(safe-area-inset-bottom));
      }
      main {
        max-width: 52rem;
        margin: 0 auto;
      }
      h1 {
        font-size: clamp(2.5rem, 9vw, 5.5rem);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.03em;
        margin: 0 0 0.75rem;
        word-break: break-word;
      }
      .intro {
        color: var(--muted);
        margin: 0 0 3rem;
        max-width: 36rem;
      }
      .intro a {
        color: inherit;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 2px solid var(--ink);
      }
      li {
        border-bottom: 1px solid var(--line);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.25rem 1.5rem;
        align-items: baseline;
        padding: 1rem 0.5rem;
      }
      .row:hover {
        background: var(--row-hover);
      }
      .name {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
        text-decoration: none;
        word-break: break-word;
      }
      a.name:hover,
      a.name:focus-visible {
        color: var(--accent);
      }
      .name.nolink {
        color: var(--muted);
        font-weight: 400;
      }
      .sub {
        grid-column: 1;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .sub a {
        color: var(--accent);
      }
      .code {
        grid-column: 2;
        grid-row: 1;
        color: var(--muted);
        font-size: 0.9rem;
        white-space: nowrap;
      }
      .code:hover {
        color: var(--accent);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .status {
        color: var(--muted);
        padding: 1rem 0.5rem;
      }
      .status.error {
        color: #c2332b;
      }
      footer {
        margin-top: 2rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Beispiele</h1>
      <p class="intro" id="intro">Alle Beispiele aus diesem Repo. Neue Ordner erscheinen hier automatisch.</p>
      <ul id="list">
        <li class="status">Beispiele werden geladen…</li>
      </ul>
      <footer id="footer"></footer>
    </main>

    <script>
      // Fallback, wenn die Seite nicht unter <owner>.github.io/<repo>/ läuft (z.B. lokal)
      const FALLBACK = { owner: "hslu-dda", repo: "hs26-share5" };

      // Ordner, die nicht in der Liste erscheinen sollen
      const IGNORE = ["node_modules", "assets", "lib", "libraries"];

      const CACHE_MINUTES = 10;

      function detectRepo() {
        const host = location.hostname;
        if (host.endsWith(".github.io")) {
          const owner = host.split(".")[0];
          const repo = location.pathname.split("/").filter(Boolean)[0];
          if (repo) return { owner, repo };
        }
        return FALLBACK;
      }

      const { owner, repo } = detectRepo();
      const list = document.getElementById("list");
      document.getElementById("title").textContent = repo;
      document.title = repo;
      document.getElementById("intro").innerHTML =
        `Alle Beispiele aus <a href="https://github.com/${owner}/${repo}">${owner}/${repo}</a>. Neue Ordner erscheinen hier automatisch.`;

      // Pfad wie "DOM structure/src/" sicher in eine URL umwandeln
      const toUrl = (dir) => dir.split("/").map(encodeURIComponent).join("/") + "/";

      async function loadTree() {
        const key = `tree:${owner}/${repo}`;
        try {
          const cached = JSON.parse(localStorage.getItem(key) || "null");
          if (cached && Date.now() - cached.time < CACHE_MINUTES * 60000) return cached.tree;
        } catch (e) {}

        // Ein einziger Request liefert alle Dateien und Ordner des Repos
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`);
        if (res.status === 403 || res.status === 429) {
          throw new Error(
            "Die GitHub-API hat zu viele Anfragen von dieser Verbindung erhalten. Lade die Seite in ein paar Minuten neu.",
          );
        }
        if (!res.ok) throw new Error(`Die Liste konnte nicht geladen werden (GitHub antwortet mit ${res.status}).`);
        const data = await res.json();

        try {
          localStorage.setItem(key, JSON.stringify({ time: Date.now(), tree: data.tree }));
        } catch (e) {}
        return data.tree;
      }

      function render(tree) {
        const isHidden = (p) => p.split("/").some((s) => s.startsWith(".") || s.startsWith("_") || IGNORE.includes(s));

        // Top-level-Ordner
        const folders = tree
          .filter((t) => t.type === "tree" && !t.path.includes("/") && !isHidden(t.path))
          .map((t) => t.path);

        // Alle index.html ausser der Übersichtsseite selbst
        const pages = tree
          .filter(
            (t) => t.type === "blob" && t.path.endsWith("index.html") && t.path !== "index.html" && !isHidden(t.path),
          )
          .map((t) => t.path.slice(0, -"index.html".length).replace(/\/$/, ""));

        folders.sort((a, b) => a.localeCompare(b, "de", { numeric: true, sensitivity: "base" }));

        if (!folders.length) {
          list.innerHTML = `<li class="status">Im Repo gibt es noch keine Ordner.</li>`;
          return;
        }

        list.innerHTML = "";
        for (const folder of folders) {
          const inside = pages.filter((p) => p === folder || p.startsWith(folder + "/")).sort();
          // Die index.html, die am wenigsten tief liegt, ist das Hauptbeispiel
          inside.sort((a, b) => a.split("/").length - b.split("/").length);
          const main = inside[0];

          const li = document.createElement("li");
          const row = document.createElement("div");
          row.className = "row";

          const name = document.createElement(main !== undefined ? "a" : "span");
          name.className = main !== undefined ? "name" : "name nolink";
          name.textContent = folder;
          if (main !== undefined) name.href = toUrl(main);
          row.appendChild(name);

          const code = document.createElement("a");
          code.className = "code";
          code.textContent = "Code ansehen";
          code.href = `https://github.com/${owner}/${repo}/tree/HEAD/${toUrl(folder)}`;
          row.appendChild(code);

          const sub = document.createElement("div");
          sub.className = "sub";
          if (main === undefined) {
            sub.textContent = "Keine index.html, nur als Code verfügbar.";
          } else if (inside.length > 1) {
            sub.innerHTML =
              "Weitere Seiten: " +
              inside
                .slice(1)
                .map((p) => `<a href="${toUrl(p)}">${p.slice(folder.length + 1)}</a>`)
                .join(", ");
          } else if (main !== folder) {
            sub.textContent = main.slice(folder.length + 1) + "/index.html";
          }
          if (sub.textContent) row.appendChild(sub);

          li.appendChild(row);
          list.appendChild(li);
        }

        document.getElementById("footer").textContent =
          `${folders.length} Ordner. Neue Ordner erscheinen nach spätestens ${CACHE_MINUTES} Minuten.`;
      }

      loadTree()
        .then(render)
        .catch((err) => {
          list.innerHTML = "";
          const li = document.createElement("li");
          li.className = "status error";
          li.textContent = err.message;
          list.appendChild(li);
        });
    </script>
  </body>
</html>
