<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5.js Instance-Mode Demo</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>p5.js 2.0 – Instance Mode Demo</h1>
    <p>Ein Klick auf den Button erzeugt neue Zufallsdaten. Alle drei Grafiken aktualisieren sich automatisch.</p>

    <button id="reloadBtn">🔄 Neue Daten laden</button>

    <div class="canvases">
      <div id="canvas1"></div>
      <div id="canvas2"></div>
      <div id="canvas3"></div>
    </div>

    <!-- Bibliotheken -->
    <script src="js/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

    <!-- Die drei Sketches definieren je eine Funktion sketch1/2/3(p) -->
    <script src="sketch1.js"></script>
    <script src="sketch2.js"></script>
    <script src="sketch3.js"></script>

    <!-- main.js lädt die Daten, startet die Instanzen und verdrahtet den Button -->
    <script src="main.js"></script>
  </body>
</html>
